services:
  # C++ Blockchain Daemon
  daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: spiralcoin-daemon
    # Keep RPC internal to the compose network; no host port mapping
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - spiralcoin-network

  # Node.js Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: spiralcoin-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - RPC_URL=http://daemon:8545
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
    volumes:
      - ./backend_data:/app/data
    depends_on:
      - daemon
    restart: unless-stopped
    networks:
      - spiralcoin-network

  # MarketFeed Service
  marketfeed:
    build:
      context: .
      dockerfile: Dockerfile.marketfeed
    container_name: spiralcoin-marketfeed
    environment:
      - NODE_ENV=production
      - NODE_PORT=4000
      - RPC_URL=http://daemon:8545
      - EXT_FEED=https://api.example.com/feed
    depends_on:
      - daemon
    restart: unless-stopped
    networks:
      - spiralcoin-network

  # Web Dashboard disabled (host nginx already serves :80)
  # Nginx reverse proxy for HTTPS and static content
  nginx:
    image: nginx:alpine
    container_name: spiralcoin-nginx
    profiles:
      - web
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - spiralcoin-network


networks:
  spiralcoin-network:
    driver: bridge
