version: '3.8'

services:
  # C++ Blockchain Daemon
  daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: spiralcoin-daemon
    ports:
      - "8545:8545"
    volumes:
      - daemon-data:/app/data
    restart: unless-stopped
    networks:
      - spiralcoin-network

  # Node.js Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: spiralcoin-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - RPC_URL=http://daemon:8545
    depends_on:
      - daemon
    restart: unless-stopped
    networks:
      - spiralcoin-network

  # MarketFeed Service
  marketfeed:
    build:
      context: .
      dockerfile: Dockerfile.marketfeed
    container_name: spiralcoin-marketfeed
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - NODE_PORT=4000
      - RPC_URL=http://daemon:8545
      - EXT_FEED=https://api.example.com/feed
    depends_on:
      - daemon
    restart: unless-stopped
    networks:
      - spiralcoin-network

  # Web Dashboard (Optional - serving trading platform)
  web:
    image: nginx:alpine
    container_name: spiralcoin-web
    ports:
      - "3000:80"
    volumes:
      - ./trading_platform.html:/usr/share/nginx/html/index.html:ro
      - ./public:/usr/share/nginx/html/public:ro
    restart: unless-stopped
    networks:
      - spiralcoin-network

volumes:
  daemon-data:
    driver: local

networks:
  spiralcoin-network:
    driver: bridge
