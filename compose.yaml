services:
  spiralcoin-api:
    image: spiralcoin-api
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: spiralcoin-api
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - spiralcoin-network
    restart: unless-stopped

  spiralcoin-marketfeed:
    image: spiralcoin-marketfeed
    build:
      context: ./marketfeed
      dockerfile: ./Dockerfile
    container_name: spiralcoin-marketfeed
    environment:
      NODE_ENV: production
      PORT: 4000
      RPC_URL: http://spiralcoin-api:5000/api/blockchain
    ports:
      - "4000:4000"
    depends_on:
      - spiralcoin-api
    networks:
      - spiralcoin-network
    restart: unless-stopped

networks:
  spiralcoin-network:
    driver: bridge
