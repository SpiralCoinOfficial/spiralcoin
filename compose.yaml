services:
  # C++ Blockchain Daemon
  daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: spiralcoin-daemon
    # Keep RPC internal to the compose network; no host port mapping
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD-SHELL
        - timeout 2 bash -lc 'cat < /dev/null > /dev/tcp/127.0.0.1/8545'
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - spiralcoin-network

  # Node.js Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: spiralcoin-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - RPC_URL=http://daemon:8545
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
    volumes:
      - ./backend_data:/app/data
    depends_on:
      daemon:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:5000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - spiralcoin-network

  # MarketFeed Service
  marketfeed:
    build:
      context: .
      dockerfile: Dockerfile.marketfeed
    container_name: spiralcoin-marketfeed
    environment:
      - NODE_ENV=production
      - NODE_PORT=4000
      - RPC_URL=http://daemon:8545
      - EXT_FEED=https://api.example.com/feed
    depends_on:
      daemon:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:4000/api/feed',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - spiralcoin-network

  # Web Dashboard disabled (host nginx already serves :80)
  # Nginx reverse proxy for HTTPS and static content
  nginx:
    image: nginx:alpine
    container_name: spiralcoin-nginx
    profiles:
      - web
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --no-check-certificate --header='Host: spiralcoin.net' -O- https://127.0.0.1/health >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - spiralcoin-network


networks:
  spiralcoin-network:
    driver: bridge
