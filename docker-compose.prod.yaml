version: '3.8'

services:
  spiralcoin-backend:
    image: node:lts-alpine
    container_name: spiralcoin-backend
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    command: sh -c "npm install && npm start"
    restart: unless-stopped
    networks:
      - spiralcoin-network

  nginx:
    image: nginx:alpine
    container_name: spiralcoin-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - spiralcoin-backend
    restart: unless-stopped
    networks:
      - spiralcoin-network

networks:
  spiralcoin-network:
    driver: bridge
