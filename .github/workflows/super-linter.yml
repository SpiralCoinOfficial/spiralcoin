# This workflow executes several linters on changed files based on languages
# used in your code base whenever you push a code or open a pull request.
#
# See: https://github.com/super-linter/super-linter
name: Lint Code Base

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  statuses: write

jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Full git history is needed to get a proper list of changed files
          # within super-linter.
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@v8
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip linters that are noisy or handled elsewhere in CI.
          # Markdown is linted by markdownlint-cli2 in build.yml.
          VALIDATE_MARKDOWN: false
          # YAML_PRETTIER is style-only (not correctness) and disagrees with
          # GitHub's own workflow indentation conventions.
          VALIDATE_YAML_PRETTIER: false
          # No Ruby or Jscpd config in repo.
          VALIDATE_RUBY: false
          VALIDATE_JSCPD: false
          # Don't scan vendored / generated content.
          FILTER_REGEX_EXCLUDE: '(^|/)(node_modules|dist|build|out|target|venv|vendor|\.git)/'
