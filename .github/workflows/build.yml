name: CI

'on':
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run markdownlint-cli2
        run: |
          npx --yes markdownlint-cli2 "**/*.md"

  docker-build:
    name: Docker Build (Dockerfile.dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          push: false
          load: false
          provenance: false
