name: CI

'on':
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# Default to least-privilege; individual jobs may widen as needed.
permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Run markdownlint-cli2
        run: |
          npx --yes markdownlint-cli2 "**/*.md"

  docker-build:
    name: Docker Build (Dockerfile.dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3.7.1 (pinned to commit SHA for supply-chain safety)
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build image
        # docker/build-push-action v6.10.0 (pinned to commit SHA for supply-chain safety)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: Dockerfile.dev
          push: false
          load: false
          provenance: false
