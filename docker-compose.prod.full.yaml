version: '3.8'

services:
  daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: spiralcoin-daemon
    ports:
      - "8545:8545"
    volumes:
      - daemon-data:/app/data
    restart: unless-stopped
    networks:
      - spiralcoin-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: spiralcoin-backend
    environment:
      - NODE_ENV=production
      - PORT=5000
      - RPC_URL=http://daemon:8545
    ports:
      - "5000:5000"
    depends_on:
      - daemon
    restart: unless-stopped
    networks:
      - spiralcoin-network

  marketfeed:
    build:
      context: .
      dockerfile: Dockerfile.marketfeed
    container_name: spiralcoin-marketfeed
    environment:
      - NODE_ENV=production
      - NODE_PORT=4000
      - RPC_URL=http://daemon:8545
    ports:
      - "4000:4000"
    depends_on:
      - daemon
    restart: unless-stopped
    networks:
      - spiralcoin-network

  nginx:
    image: nginx:alpine
    container_name: spiralcoin-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - marketfeed
    restart: unless-stopped
    networks:
      - spiralcoin-network

volumes:
  daemon-data:
    driver: local

networks:
  spiralcoin-network:
    driver: bridge
