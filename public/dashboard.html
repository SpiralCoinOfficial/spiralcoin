<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Wallet Dashboard • SpiralCoin</title>
    <link rel="icon" type="image/png" sizes="64x64" href="assets/SpiralCoin_logo.png">
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            background: #0f0f23;
            color: #fff;
            margin: 0;
        }

        header {
            padding: 16px 24px;
            background: #111735;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        a {
            color: #ffcc00;
        }

        .wrap {
            max-width: 960px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .card {
            background: #1a1a2e;
            border: 1px solid rgba(255, 204, 0, .2);
            border-radius: 10px;
            padding: 16px;
            margin: 12px 0;
        }

        h1,
        h2 {
            color: #ffcc00;
        }

        button {
            border: 1px solid #ffcc00;
            background: transparent;
            color: #ffcc00;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px dashed rgba(255, 255, 255, .08);
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
    </style>
    <script>
        function token() { return localStorage.getItem('spc_token') || '' }
        async function api(path, opts = {}) {
            const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token()}`, ...(opts.headers || {}) } });
            if (r.status === 401) { location.href = '/login.html'; throw new Error('auth'); }
            const j = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(j.error || 'Request failed');
            return j;
        }
        async function load() {
            if (!token()) { location.href = '/login.html'; return; }
            try {
                const me = await api('/api/user/me');
                document.getElementById('welcome').textContent = `Welcome, ${me.username}`;
                await refreshWallets();
            } catch (e) { console.error(e); }
        }
        async function refreshWallets() {
            const data = await api('/api/user/wallet/my');
            const tbody = document.getElementById('addrBody');
            tbody.innerHTML = '';
            for (const row of (data.addresses || [])) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${row.address}</td><td>${Number(row.balance || 0).toLocaleString()}</td>`;
                tbody.appendChild(tr);
            }
        }
        async function newAddress() {
            const res = await api('/api/user/wallet/new', { method: 'POST', body: JSON.stringify({}) });
            await refreshWallets();
        }
        function logout() { localStorage.removeItem('spc_token'); location.href = '/login.html' }
        window.addEventListener('DOMContentLoaded', load);
    </script>
</head>

<body>
    <header>
        <div id="welcome">My Wallet</div>
        <div class="row">
            <a href="/trading_platform.html">Trading</a>
            <a href="/exchange">Exchange Info</a>
            <button onclick="logout()">Logout</button>
        </div>
    </header>
    <div class="wrap">
        <div class="card">
            <h2>Your Addresses</h2>
            <div class="row" style="margin: 8px 0 12px">
                <button onclick="newAddress()">Generate New Address</button>
                <button onclick="refreshWallets()">Refresh</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Address</th>
                        <th>Balance (SPRC)</th>
                    </tr>
                </thead>
                <tbody id="addrBody"></tbody>
            </table>
        </div>
    </div>
</body>

</html>
