<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login • SpiralCoin</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div
        style="max-width:420px;margin:2rem auto;padding:1rem;background:#1a1a2e;color:#fff;border:1px solid rgba(255,204,0,0.2);border-radius:8px;">
        <h1 style="color:#ffcc00">Login</h1>
        <form id="login-form">
            <label>Email</label>
            <input type="email" id="email" required style="width:100%;padding:0.5rem;margin:0.25rem 0;">
            <label>Password</label>
            <input type="password" id="password" required style="width:100%;padding:0.5rem;margin:0.25rem 0;">
            <button type="submit"
                style="margin-top:0.5rem;padding:0.5rem 1rem;background:#ffcc00;border:none;border-radius:6px;color:#000;cursor:pointer;">Login</button>
        </form>
        <p id="msg" style="margin-top:0.5rem;color:#b0b0b0"></p>
        <p><a href="/signup.html">Create an account</a> • <a href="/trading_platform.html">Trading</a></p>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
                const data = await res.json();
                if (res.ok && data.token) { localStorage.setItem('token', data.token); document.getElementById('msg').textContent = 'Logged in.'; } else { document.getElementById('msg').textContent = data.error || 'Login failed'; }
            } catch (e) { document.getElementById('msg').textContent = 'Error: ' + (e?.message || e); }
        });
    </script>
</body>

</html>
