<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SpiralCoin (SPLC) Dashboard</title>
</head>
<body>
    <h1>SpiralCoin (SPLC)</h1>
    <div>
        <h3>Wallet Balance: <span id="walletBalance">0</span> SPLC</h3>
    </div>
    <div>
        <h3>Market Data</h3>
        <p>SPLC Price: $<span id="splcPrice">0</span> | Market Cap: $<span id="splcMarketCap">0</span></p>
        <p>BTC Price: $<span id="btcPrice">0</span> | Market Cap: $<span id="btcMarketCap">0</span></p>
        <p>ETH Price: $<span id="ethPrice">0</span> | Market Cap: $<span id="ethMarketCap">0</span></p>
    </div>
    <div>
        <input type="number" id="buyAmount" placeholder="Amount to buy">
        <button id="buyButton">Buy SPLC</button>
    </div>
    <div>
        <input type="number" id="sellAmount" placeholder="Amount to sell">
        <button id="sellButton">Sell SPLC</button>
    </div>
    <div>
        <button id="mineButton">Mine SPLC</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
