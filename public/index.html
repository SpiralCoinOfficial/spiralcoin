<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIRALCOIN (SPLC) Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>SPIRALCOIN <span class="ticker">SPLC</span></h1>
            <p class="subtitle">Sovereign Digital Asset & Trading Ecosystem</p>
        </header>

        <main class="grid-layout">
            <section class="card">
                <h2>Market Intelligence</h2>
                <canvas id="priceChart"></canvas>
            </section>

            <section class="card">
                <h2>User Portfolio / Registration</h2>
                <form id="userForm">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="text" id="walletAddress" placeholder="Wallet Address (0x...)" required>
                    <button type="submit">Load / Register Account</button>
                </form>
                <div id="output" class="output-box"></div>
            </section>
        </main>
    </div>

    <script src="js/wallet.js"></script>
    <script src="js/app.js"></script>
    <script src="js/chart.js"></script>
</body>
</html>
