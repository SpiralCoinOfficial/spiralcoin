server {
    listen 80;
  server_name www.spiralcoin.net;
  return 301 https://spiralcoin.net$request_uri;
}

server {
  listen 80;
  server_name spiralcoin.net api.spiralcoin.net;
    return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.spiralcoin.net;

  ssl_certificate /etc/letsencrypt/live/spiralcoin.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/spiralcoin.net/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://spiralcoin.net$request_uri;
}

server {
    listen 443 ssl http2;
  server_name spiralcoin.net api.spiralcoin.net;

    ssl_certificate /etc/letsencrypt/live/spiralcoin.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spiralcoin.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    # Health
    location = /health { proxy_pass http://127.0.0.1:5000/health; }

    # Marketfeed endpoints
    location /api/feed { proxy_pass http://127.0.0.1:4000/api/feed; proxy_http_version 1.1; proxy_set_header Connection ""; }
    location /api/dqve { proxy_pass http://127.0.0.1:4000/api/dqve; proxy_http_version 1.1; proxy_set_header Connection ""; }

    # Backend API
    location /api/ {
      proxy_pass http://127.0.0.1:5000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Trading UI
    location = /trading_platform.html { proxy_pass http://127.0.0.1:5000/trading_platform.html; }
    location ~ ^/(trading|trade|start|app/trade)$ { return 302 /trading_platform.html; }

    # App + static
    location / {
      proxy_pass http://127.0.0.1:5000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
}
