user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    upstream backend {
        # Prefer service name resolution; keep IP fallback if needed
        server backend:5000;
        # server 172.18.0.3:5000; # optional fallback if DNS fails
    }

    # HTTP server: canonical www -> apex
    server {
        listen 80;
        server_name www.spiralcoin.net;
        return 301 https://spiralcoin.net$request_uri;
    }

    # HTTP server: redirect everything else to HTTPS on same host
    server {
        listen 80;
        server_name spiralcoin.net api.spiralcoin.net localhost;
        return 301 https://$host$request_uri;
    }

    # HTTPS canonical redirect for www -> apex
    server {
        listen 443 ssl;
        http2 on;
        server_name www.spiralcoin.net;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://spiralcoin.net$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name spiralcoin.net api.spiralcoin.net;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE+AESGCM';
        ssl_prefer_server_ciphers on;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        root /usr/share/nginx/html;
        index index.html;

        # Serve static files
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # API routes: proxy all /api/* to backend
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Trading page and convenient aliases -> backend route handlers
        location = /trading_platform.html { proxy_pass http://backend; }
        location = /trading { proxy_pass http://backend; }
        location = /trade { proxy_pass http://backend; }
        location = /start { proxy_pass http://backend; }
        location = /app/trade { proxy_pass http://backend; }

        # Proxy health and exchange pages to backend
        location = /health { proxy_pass http://backend/health; }
        location = /exchange { proxy_pass http://backend/exchange; }
        location = /listing { proxy_pass http://backend/listing; }

        # Route groups
        location /blockchain/ { proxy_pass http://backend; }
        location /market/ { proxy_pass http://backend; }
        location /mining/ { proxy_pass http://backend; }
        location /wallet/ { proxy_pass http://backend; }
        location /stats/ { proxy_pass http://backend; }

        # SPA fallback for static site
        location / { try_files $uri $uri/ /index.html; }

        error_page 404 /index.html;
    }
}
